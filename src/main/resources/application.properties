# --- DATASOURCE & DATABASE ---
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/vereinskasse}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- H2 CONSOLE (In Prod auf false setzen!) ---
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# --- FLYWAY ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.table=flyway_schema_history

# --- SERVLET / UPLOADS ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- JWT CONFIGURATION ---
# WICHTIG: Das Secret MUSS von außen überschrieben werden
jwt.secret=${JWT_SECRET:bitte_ein_sehr_langes_zufaelliges_secret_hier_eintragen_mindestens_64_zeichen}
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# --- SERVER & SSL ---
server.port=${SERVER_PORT:8443}
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEYSTORE_PATH:./data/certs/keystore.p12}
server.ssl.key-store-password=${SSL_PASSWORD:-PLEASE123SET456inEnv$$$$$}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=vereinskasse

# --- LOGGING ---
logging.level.org.flywaydb=info

# --- APP PATHS ---
app.upload-dir=${UPLOAD_DIR:./data/media}