# --- DATASOURCE & DATABASE ---
# Nutzt jetzt den absoluten Pfad /app/data
spring.datasource.url=${DB_URL:jdbc:h2:file:/app/data/vereinskasse}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- H2 CONSOLE (In Prod auf false setzen!) ---
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# --- FLYWAY ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.table=flyway_schema_history

# --- SERVLET / UPLOADS ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- JWT CONFIGURATION ---
jwt.secret=${JWT_SECRET:-bitteeinsehrlangesufaelligessecrethiereintragenmindestens64zeichen}
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# --- SERVER & SSL ---
server.port=${SERVER_PORT:-8443}
server.ssl.enabled=${SSL_ENABLED:-true}
# Wichtig: Spring bevorzugt das "file:" Präfix bei absoluten Pfaden auf der Festplatte
server.ssl.key-store=${SSL_KEYSTORE_PATH:file:/app/certs/keystore.p12}
# Muss EXAKT dem Passwort aus der entrypoint.sh entsprechen!
server.ssl.key-store-password=${SSL_PASSWORD:KeystorePasswort123}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=vereinskasse

# --- LOGGING ---
logging.level.org.flywaydb=info

# --- APP PATHS ---
# Nutzt jetzt den absoluten Pfad /app/data/media
app.upload-dir=${UPLOAD_DIR:/app/data/media}