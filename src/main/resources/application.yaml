spring:
  datasource:
    url: jdbc:h2:file:./data/vereinskasse
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none   # Hibernate validiert/ändert Schema nicht
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway: { enabled: true, locations: classpath:db/migration, baseline-on-migrate: true, validate-on-migrate: true, out-of-order: false, table: flyway_schema_history }

# ---------------------------
# JWT Configuration
# ---------------------------
jwt:
  secret: mySuperSecretKeyForJwtDontUseInProd123AndNeedToBeVeryLongSoIMTypingRandomStuff
  access-expiration-ms: 900000   # 15 Minuten
  refresh-expiration-ms: 604800000 # 7 Tage

# ---------------------------
# Server
# ---------------------------
server:
  port: 8080

logging:
  level:
    org.flywaydb: debug
